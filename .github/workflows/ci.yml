name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Rehearse database migrations
        run: |
          migration_db=$(mktemp)
          for migration in backend/src/db/migrations/*.sql; do sqlite3 "$migration_db" < "$migration"; done
      - run: npm run build
