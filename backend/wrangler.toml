name = "telc-prep-api"
main = "src/index.ts"
compatibility_date = "2024-11-12"

[vars]
APP_URL = "http://localhost:5173"
WHATSAPP_NUMBER = "212720061881"
CIH_ACCOUNT_NUMBER = "REPLACE_WITH_CIH_RIB"
ADMIN_EMAIL = "admin@example.com"

[[d1_databases]]
binding = "DB"
database_name = "telc-prep"
database_id = "YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "PAYMENT_PROOFS"
bucket_name = "telc-payment-proofs"
